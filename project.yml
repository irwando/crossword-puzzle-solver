name: Crosswords
options:
  bundleIdPrefix: com.irwando
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  CrosswordKit:
    path: Packages/CrosswordKit
targets:
  Crosswords:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: CrosswordKit
        product: CrosswordCore
      - package: CrosswordKit
        product: PuzzleFormats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irwando.crosswords
        PRODUCT_NAME: Crosswords
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crosswords
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SELECTED_FILES: readwrite
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Resources/Crosswords-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: []
